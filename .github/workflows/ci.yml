name: Validate the atelier
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      STRAPI_TELEMETRY_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/migrations/package-lock.json
      - run: npm ci
      - run: npm ci --prefix tools/migrations
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:cms-contract
      - run: npm run build
      - run: npm run build:cms
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Intentionally blocking while the upstream findings in docs/SECURITY.md remain unresolved.
      - run: npm audit --omit=dev --audit-level=high
